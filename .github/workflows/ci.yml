name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JUnit console standalone
        run: curl -sSL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile main sources
        run: |
          mkdir -p build/main build/test
          find src/main/java -name '*.java' > sources.txt
          javac -d build/main @sources.txt

      - name: Compile test sources
        run: javac -cp "build/main:junit.jar" -d build/test $(find src/test/java -name '*.java')

      - name: Run tests
        run: java -cp "build/main:build/test:junit.jar" org.junit.platform.console.ConsoleLauncher --scan-class-path build/test

      - name: Smoke-test the demo
        run: java -cp build/main bastion.examples.Demo
